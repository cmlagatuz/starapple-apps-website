name: Verify & Deploy StarApple Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starapple-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test and build
        run: npm run check

      - name: Verify production build (never deploy Firebase placeholder)
        run: |
          test -f dist/index.html
          test -f dist/assets/main.js
          test -f dist/media/starapple-core-poster.webp
          grep -q 'StarApple Apps LLC' dist/index.html
          grep -Fq 'https://www.unkey.com/videos/home/hero-av1.mp4' dist/index.html
          grep -q 'history.replaceState' dist/index.html
          if grep -q 'Firebase Hosting Setup Complete' dist/index.html; then
            echo 'Unexpected default Firebase page in production build' >&2
            exit 1
          fi

      - name: Deploy Firebase Hosting live
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STARAPPLEAPPS }}
          channelId: live
          projectId: starappleapps
